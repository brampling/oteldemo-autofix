# Overrides for the upstream opentelemetry-demo Helm chart (chart version pinned
# in k8s/apps/otel-demo.yaml). Only differences from the chart defaults live
# here; see the chart's values.yaml for everything else.

components:
    # Built from src/product-catalog by .github/workflows/build-product-catalog.yml.
    # CI rewrites the tag on the marked line after every build on main; don't
    # edit that line by hand (and keep the marker comment intact).
    product-catalog:
        imageOverride:
            repository: ghcr.io/brampling/oteldemo-autofix-product-catalog
            tag: sha-441be04 # ci:product-catalog-tag

    # --- Trimmed to fit a single ~8 GiB node -------------------------------
    # The chart sets only memory limits, so requests default to the limits and
    # the full demo (~6.9 GiB) would not schedule. None of these are on the
    # request path of the shop or the load generator.
    chatbot:
        enabled: false
    mcp:
        enabled: false
    telemetry-docs:
        enabled: false

    # Plain-HTTP Locust users only: the headless-Chromium browser users are
    # what need the chart's 1500Mi limit.
    load-generator:
        envOverrides:
            - name: LOCUST_BROWSER_TRAFFIC_ENABLED
              value: "false"
        resources:
            limits:
                memory: 400Mi

# Bundled observability backends: disabled. Telemetry goes to Dash0 instead.
jaeger:
    enabled: false
prometheus:
    enabled: false
grafana:
    enabled: false
opensearch:
    enabled: false

# The demo's collector sends all application telemetry straight to Dash0.
opentelemetry-collector:
    # Auth token for Dash0, read from a Secret that is NOT in git (a copy of the
    # one the Dash0 operator uses). Create it once, out-of-band:
    #   kubectl -n otel-demo create secret generic dash0-authorization-secret \
    #     --from-literal=token='<DASH0_AUTH_TOKEN>'
    extraEnvs:
        - name: DASH0_AUTH_TOKEN
          valueFrom:
              secretKeyRef:
                  name: dash0-authorization-secret
                  key: token

    # The Dash0 operator (k8s/apps/dash0-operator.yaml) already collects host,
    # kubelet and cluster metrics for this namespace; don't send them twice.
    presets:
        hostMetrics:
            enabled: false
        kubeletMetrics:
            enabled: false
        clusterMetrics:
            enabled: false

    config:
        exporters:
            otlp_grpc/dash0:
                endpoint: ingress.europe-west4.gcp.dash0.com:4317
                headers:
                    Authorization: Bearer ${env:DASH0_AUTH_TOKEN}
                    Dash0-Dataset: oteldemo-autofix
                sending_queue:
                    batch: {}

        processors:
            resource:
                attributes:
                    # Upstream's entry, restated because Helm replaces lists.
                    - key: service.instance.id
                      from_attribute: k8s.pod.uid
                      action: insert
                    # Matches the operator's clusterName, so app telemetry and
                    # Kubernetes telemetry line up in Dash0.
                    - key: k8s.cluster.name
                      value: oteldemo-autofix
                      action: upsert

        service:
            pipelines:
                # Upstream exports to the (disabled) jaeger/prometheus/opensearch
                # backends and the debug exporter; send to Dash0 instead.
                traces:
                    exporters: [otlp_grpc/dash0, span_metrics]
                metrics:
                    exporters: [otlp_grpc/dash0]
                logs:
                    exporters: [otlp_grpc/dash0]
                # Nothing produces profiles here (the eBPF profiler is off).
                profiles:
                    exporters: [debug]
