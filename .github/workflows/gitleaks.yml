name: gitleaks

# Secret scanning as a safety net for this public repo. Runs on every push and
# PR; scans the full git history (fetch-depth: 0). Known findings in the
# vendored upstream demo source are listed in .gitleaksignore.
on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    scan:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - name: Run gitleaks
              uses: gitleaks/gitleaks-action@v3
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
